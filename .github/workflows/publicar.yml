# Cópia de reserva da pasta site/ na hospedagem Locaweb (ipjc.org.br, pasta web/natal).
# O site oficial é publicado pelo GitHub Pages (pages.yml); esta cópia só roda manualmente
# (Actions > Publicar na Locaweb > Run workflow) e serve para voltar à Locaweb se um dia for preciso.
# Os dados de acesso ficam em Settings > Secrets and variables > Actions:
#   FTP_HOST, FTP_USER e FTP_PASS
name: Publicar na Locaweb (reserva)

on:
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    name: Enviar para a Locaweb
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Conferir dados de acesso
        id: conferir
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "::warning::Faltam os secrets FTP_HOST, FTP_USER e FTP_PASS (Settings > Secrets and variables > Actions). Nada foi publicado."
            echo "pronto=nao" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=sim" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.conferir.outputs.pronto == 'sim'

      - name: FTP Deploy Locaweb
        if: steps.conferir.outputs.pronto == 'sim'
        uses: locaweb/ftp-deploy@1.0.0
        with:
          host: ${{ secrets.FTP_HOST }}
          user: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          localDir: "site"
          # Hospedagem Windows: a raiz do site é "web"; o subdomínio natal aponta para a pasta natal
          remoteDir: "web/natal"

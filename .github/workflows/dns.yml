# Verificação manual do DNS e da resposta do site. Não usa senhas.
name: Verificar DNS

on:
  workflow_dispatch:

jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: DNS
        run: |
          for s in "" @ns2.wixdns.net @ns3.wixdns.net @8.8.8.8; do
            echo "== natal.ipjc.org.br $s"; dig +short $s A natal.ipjc.org.br; dig +short $s CNAME natal.ipjc.org.br
          done
          echo "== ipjc.org.br NS"; dig +short NS ipjc.org.br
          echo "== CAA (quem pode emitir certificado)"; for n in natal.ipjc.org.br ipjc.org.br org.br; do echo "-- $n"; dig +short CAA "$n"; done
      - name: Resposta do site
        run: |
          for u in http://natal.ipjc.org.br/ https://natal.ipjc.org.br/; do
            echo "== $u"
            curl -sS -m 20 -D - -o /tmp/c "$u" | head -8 || true
            grep -o '<title>[^<]*' /tmp/c || true
          done

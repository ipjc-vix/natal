# Publica a pasta site/ no GitHub Pages (https://natal.ipjc.org.br) a cada alteração no main.
# Configuração (uma vez): Settings > Pages > Source: "GitHub Actions"; Custom domain: natal.ipjc.org.br; Enforce HTTPS.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
